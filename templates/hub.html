<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG MBTI - 메뉴</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/hub.css') }}">
</head>

<body class="hub-body">
    <!-- ==========================================
         [담당: HTML/CSS 동료] 로그인 직후 허브(메뉴) 화면
         3분기: 로그아웃 / 성향 테스트 / 커뮤니티

         이 파일은 로직이 거의 없어서 자유도가 높습니다.
         아래 두 값만 Jinja2에서 그대로 써주세요:
           - {{ nickname }}          : 유저 닉네임
           - {% if test_done %}...{% endif %} : 테스트 완료 여부에 따라 문구 분기
         ========================================== -->

    <header class="top-nav">
        <!-- TODO: [HTML/CSS] 로고 / "메뉴" 타이틀 / [로그아웃] 버튼 -->
        <div class="hub-nav-bar">
            <a href="{{ url_for('community') }}" class="back-link" title="뒤로가기">‹</a>
            <button class="hub-nav-logout" onclick="logout()">로그아웃</button>
        </div>
    </header>

    <main class="hub-container">
        <!-- TODO: [HTML/CSS] 카드 2개
             - href="{{ url_for('test') }}" : 성향 테스트로 이동
               {% if test_done %} 완료 문구 {% else %} 미완료 문구 {% endif %}
             - href="{{ url_for('community') }}" : 커뮤니티로 이동 -->
        <div class="hub-menu">
            <!-- 1. 성향 테스트 카드 -->
            <div class="hub-card test-card">
                <div class="hub-icon-wrapper">
                    <span class="hub-icon"><img src="{{url_for('static', filename='images/hub-test-icon.png')}}"
                            alt=""></span>
                </div>
                <h3 class="hub-card-title">성향 테스트</h3>
                <p class="hub-card-desc">
                    {% if test_done %}
                    이미 테스트를 완료하셨습니다.<br>
                    언제든지 다시 테스트하여 새로운 직업을 찾아보세요!
                    {% else %}
                    완료 여부에 따라 문구 변경
                    {% endif %}
                </p>
                <div class="hub-card-action">
                    <a href="{{ url_for('test') }}" class="hub-btn test-btn">테스트 시작하기</a>
                </div>
            </div>

            <!-- 2. 커뮤니티 카드 -->
            <div class="hub-card community-card">
                <div class="hub-icon-wrapper">
                    <span class="hub-icon"><img src="{{url_for('static', filename='images/hub-community-icon.png')}}"
                            alt=""></span>
                </div>
                <h3 class="hub-card-title">커뮤니티</h3>
                <p class="hub-card-desc">모험가들의 게시판</p>
                <div class="hub-card-action">
                    <a href="{{ url_for('community') }}" class="hub-btn community-btn">게시판 가기</a>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 로그아웃 로직은 test.html / community.html 에서도 동일하게 쓰는 코드라
        // 그대로 재사용하시면 됩니다 (자유롭게 옮겨써도 OK)
        async function logout() {
            localStorage.removeItem('JWT_TOKEN');
            try {
                await fetch('/api/logout', { method: 'POST' });
            } catch (e) {
                console.error('로그아웃 요청 실패:', e);
            }
            location.href = '/';
        }
    </script>
</body>

</html>
