<!DOCTYPE html>
<html lang="ko">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>RPG MBTI - 커뮤니티</title>
     <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
     <link rel="stylesheet" href="{{ url_for('static', filename='css/community.css') }}">


</head>

<body class="community-body">
     <!-- ==========================================
         [담당: HTML/CSS 동료]
         커뮤니티 게시판 목록 화면

         참고: 아래 요소들의 id는 community.js가 그대로 찾아서 씁니다.
               id 이름을 바꾸면 JS가 못 찾아서 화면이 안 그려지니
               절대 바꾸지 말고, "안에 어떻게 생겼는지"만 자유롭게 꾸며주세요.
               (예: <button id="write-btn">여기 텍스트/아이콘/스타일은 자유,
                    id="write-btn"만 유지)

         와이어프레임 참고 (Claude가 이전에 보여준 3장):
           - 상단: 검색창(select + input + button), 글쓰기 버튼
           - 중단: 최신순/오래된순 토글, 게시글 목록
           - 하단: 검색결과 없음 안내문구, 페이지네이션
         ========================================== -->

     <header class="top-nav">
          <!-- TODO: [HTML/CSS] 로고, "커뮤니티" 타이틀, [메뉴로]/[로그아웃] 링크 배치
             참고용 기존 헤더 패턴: hub.html, test.html 의 <header class="top-nav"> 구조 재사용 권장 -->
          <div class="community-nav-bar">
               <div class="community-nav-left">
                    <a href="{{ url_for('home') }}">
                         <img src="{{url_for('static', filename='images/hub-top-icon.png')}}" alt="로고"
                              class="community-nav-logo" onerror="this.style.display='none'">
                    </a>
               </div>
               <h1 class="community-nav-title">커뮤니티</h1>
               <div class="community-nav-right">
                    <button class="community-nav-logout" onclick="logout()">로그아웃</button>
               </div>
          </div>
     </header>

     <main class="community-container">
          <!-- TODO: [HTML/CSS] 검색 영역
             - select id="search-target" : option value="all|title|content|nickname" 4개
             - input id="search-input" : placeholder "2글자 이상 입력"
             - button id="search-btn" : 검색 버튼
             - button id="write-btn" : 글쓰기 버튼 (모달 열기용) -->
          <div class="board-toolbar">
               <div class="search-box">
                    <select id="search-target" class="search-target">
                         <option value="all">전체</option>
                         <option value="title">제목</option>
                         <option value="content">내용</option>
                         <option value="nickname">작성자</option>
                    </select>
                    <input type="text" id="search-input" class="search-input" placeholder="2글자 이상 입력">
                    <button type="button" id="search-btn" class="search-btn">검색</button>
               </div>
               <button type="button" id="write-btn" class="write-btn">+ 글쓰기</button>
          </div>

          <!-- TODO: [HTML/CSS] 정렬 탭
             - button class="sort-btn" data-sort="newest" : 최신순 (기본 active)
             - button class="sort-btn" data-sort="oldest" : 오래된순
             주의: class="sort-btn"과 data-sort 속성은 JS가 querySelectorAll로 찾습니다.
                   버튼 개수를 늘리거나 줄이지 마세요 (2개 고정). -->
          <div class="sort-tabs">
               <button type="button" class="sort-btn active" data-sort="newest">최신순</button>
               <button type="button" class="sort-btn" data-sort="oldest">오래된순</button>
          </div>

          <!-- 아래 두 요소는 안이 비어있어도 OK. community.js가 실행 시점에
             내용을 채워넣습니다. 직접 더미 데이터를 넣지 마세요. -->
          <div id="post-list" class="post-list"></div>
          <div id="empty-msg" class="empty-msg hidden">검색 결과가 없습니다. (유사도 70% 이상 일치하는 글 없음)</div>
          <div id="pagination" class="pagination"></div>

     </main>

     <!-- TODO: [HTML/CSS] 글쓰기/수정 모달
         id는 절대 변경 금지 (community.js가 그대로 참조):
           - div id="write-modal" (평소엔 hidden 클래스로 숨김)
             - h3 id="modal-title" (JS가 "새 글 작성" / "글 수정"으로 텍스트를 바꿈)
             - input id="post-title-input"
             - textarea id="post-content-input"
             - div id="modal-error" (평소엔 hidden, 에러 있을 때만 텍스트 채워짐)
             - button id="modal-cancel-btn"
             - button id="modal-submit-btn" -->
     <div id="write-modal" class="modal-backdrop hidden">
          <div class="modal-box">
               <h3 id="modal-title" class="modal-title">새 글 작성</h3>
               <div id="modal-error" class="modal-error hidden"></div>
               <div class="modal-form-group">
                    <input type="text" id="post-title-input" class="modal-input" placeholder="제목 (2글자 이상)">
                    <textarea id="post-content-input" class="modal-textarea" rows="6"
                         placeholder="내용을 입력하세요 (2글자 이상)"></textarea>
               </div>
               <div class="modal-actions">
                    <button type="button" id="modal-cancel-btn" class="modal-btn cancel-btn">취소</button>
                    <button type="button" id="modal-submit-btn" class="modal-btn submit-btn">등록</button>
               </div>
          </div>
     </div>

     <script>
          // David가 서버에서 내려주는 값 (건드리지 않아도 됨)
          const CURRENT_USER_ID = "{{ current_user_id }}";
     </script>
     <script src="{{ url_for('static', filename='js/community.js') }}"></script>
</body>

</html>
